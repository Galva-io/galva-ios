# CI — runs on every PR and every push to main.
#
# Jobs:
#   • lint      — scripts/lint.sh (host-app perf hazards, crash patterns)
#   • test      — swift test (~20s, 200+ tests)
#   • test-ios  — the same tests on an iOS Simulator, including the UIKit /
#                 WebKit ones `swift test` on macOS doesn't build
#   • e2e       — scripts/e2e.sh: the demo app's UI tests against an
#                 in-process mock
#   • perf      — scripts/perf.sh: the SDK's overhead in the demo app; fails
#                 if extra memory passes its budget

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-flight CI runs for the same branch when a new commit
# lands. Saves CI minutes; the latest commit is always what matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/lint.sh
        run: ./scripts/lint.sh

  test:
    name: Test (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The StoreKit promotional-offer path calls
      # `Product.PurchaseOption.promotionalOffer(_:compactJWS:)`, an iOS 26
      # SDK symbol (`@backDeployed(before: iOS 26.0)` — it RUNS on iOS 15+
      # but only COMPILES with Xcode 26), plus the `.unsupported`
      # StoreKitError case. Select the newest Xcode 26 on the runner;
      # fall back to the newest installed Xcode if none is present.
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -z "$XCODE" ] && XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version

      - name: Cache SPM build artefacts
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: swift test
        run: swift test --parallel

  test-ios:
    name: Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Same Xcode selection as the unit-test job (see the comment there).
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -z "$XCODE" ] && XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version

      # The in-app message presenter, WebView and presentation tests sit
      # behind `#if canImport(UIKit) && canImport(WebKit)`, so only an iOS
      # build runs them. Picks the first available iPhone simulator by UDID,
      # as scripts/e2e.sh does — names vary by installed runtime.
      - name: xcodebuild test
        run: |
          UDID="$(xcrun simctl list devices available \
              | grep -E 'iPhone' \
              | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' \
              | head -1)"
          if [ -z "$UDID" ]; then
            echo "error: no available iPhone simulator found" >&2
            exit 2
          fi
          xcodebuild test -scheme Galva -destination "platform=iOS Simulator,id=$UDID"

  e2e:
    name: E2E (UI tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Same Xcode selection as the unit-test job — the demo links the SDK,
      # which needs the iOS 26 SDK to compile (see the comment above).
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -z "$XCODE" ] && XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version

      # Tuist generates the demo project (.xcodeproj/.xcworkspace are
      # git-ignored). Installed at the version pinned in .mise.toml so CI is
      # reproducible.
      - name: Install Tuist (pinned via .mise.toml)
        uses: jdx/mise-action@v2

      # Generates the project + runs the XCUITest suite against the in-process
      # mock (deterministic, no network). The script auto-detects an available
      # iPhone simulator by UDID; set GALVA_E2E_DESTINATION to override.
      - name: Run E2E suite
        run: ./scripts/e2e.sh

  perf:
    name: Performance (SDK overhead)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -z "$XCODE" ] && XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version

      - name: Install Tuist (pinned via .mise.toml)
        uses: jdx/mise-action@v2

      # Measures the SDK's footprint (memory/launch/CPU) as a delta vs a
      # baseline with no Galva, and writes Examples/GalvaDemo/perf-report.md.
      # Fails the job if the gated memory budget is breached — immediate
      # notification. (Layer-1 main-thread budgets ride the `test` job.)
      - name: Run performance suite
        run: ./scripts/perf.sh

      # Publish the before/after report on success OR failure.
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: Examples/GalvaDemo/perf-report.md
          if-no-files-found: warn
